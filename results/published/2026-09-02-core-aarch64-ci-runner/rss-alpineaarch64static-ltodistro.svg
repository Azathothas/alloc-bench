<text x="397.7" y="79.7" font-size="10.5" fill="#5b636d">1.569x  (5.4 MiB)</text>
<text x="250" y="105.7" font-size="11" fill="#1b1f24" text-anchor="end">rpmalloc / rust-global</text>
<rect x="260" y="93.0" width="94.6" height="15" rx="2" fill="#d1495b"/>
<text x="360.6" y="105.7" font-size="10.5" fill="#5b636d">1.127x  (3.9 MiB)</text>
<text x="250" y="131.7" font-size="11" fill="#1b1f24" text-anchor="end">mimalloc / rust-global</text>
<rect x="260" y="119.0" width="425.9" height="15" rx="2" fill="#d1495b"/>
<text x="691.9" y="131.7" font-size="10.5" fill="#5b636d">5.075x  (17.5 MiB)</text>
<text x="250" y="157.7" font-size="11" fill="#1b1f24" text-anchor="end">snmalloc / rust-global</text>
