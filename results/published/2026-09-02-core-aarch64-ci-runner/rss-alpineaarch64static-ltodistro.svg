<text x="424.8" y="157.7" font-size="10.5" fill="#5b636d">1.892x  (6.5 MiB)</text>
<text x="250" y="183.7" font-size="11" fill="#1b1f24" text-anchor="end">system (control)</text>
<rect x="260" y="171.0" width="83.9" height="15" rx="2" fill="#8a8f98"/>
