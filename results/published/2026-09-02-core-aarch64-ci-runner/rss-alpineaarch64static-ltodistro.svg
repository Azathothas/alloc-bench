<svg xmlns="http://www.w3.org/2000/svg" width="810" height="252" viewBox="0 0 810 252" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1b1f24">Peak resident set relative to the control - alpine / aarch64 / static-lto / distro</text>
<text x="16" y="45" font-size="11" fill="#5b636d">workload `literal`; ru_maxrss from wait4, median of the run's samples; lower is less memory</text>
<line x1="343.9" y1="52.0" x2="343.9" y2="218.0" stroke="#d8dce1" stroke-width="1" stroke-dasharray="4 3"/>
<text x="343.9" y="48.0" font-size="10" fill="#5b636d" text-anchor="middle">control</text>
<text x="250" y="79.7" font-size="11" fill="#1b1f24" text-anchor="end">jemalloc / rust-global</text>
