<svg xmlns="http://www.w3.org/2000/svg" width="810" height="200" viewBox="0 0 810 200" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
